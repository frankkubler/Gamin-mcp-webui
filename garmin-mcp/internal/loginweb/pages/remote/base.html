{{define "base"}}<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{template "title" .}} &middot; garmin-mcp</title>
<link rel="stylesheet" href="/login/style.css">
</head>
<body>
<main>
<h1>{{template "title" .}}</h1>
{{if .Message}}<p class="message" role="alert">{{.Message}}</p>{{end}}
{{template "content" .}}
</main>
<footer>
<p class="notice">Cette page est servie par le déploiement garmin-mcp auquel vous
vous connectez. Ce n'est pas une page Garmin, et Garmin ne l'exploite pas.</p>
</footer>
</body>
</html>
{{end}}
